# barctl's modules: the default the package ships (dotfiles record 0003 §B4).
#
# The dotfiles' desktop/.config/barctl/modules.toml, linked to $XDG_CONFIG_HOME/barctl/modules.toml,
# replaces this file whole. Each module here is a polybar `custom/ipc` module whose
# `hook-0 = barctl render <module>`. Clicks run detached, through `barctl click <module> <button>`;
# {target} is the module's current target (the shown player, the default sink), filled in as a
# whole argument. Glyphs are current Nerd Font codepoints, written as escapes.

# The default sink's volume, from `pactl subscribe`.
[modules.audio-level]
source = "volume"
display = "both"
glyph = "\U000F0581" # md-volume_off: no pulse server yet

[modules.audio-level.clicks]
left = ["audio", "mute-toggle"]
right = ["pwvucontrol"]
scroll-up = ["audio", "volume-increase"]
scroll-down = ["audio", "volume-decrease"]

# The chosen MPRIS player's icon and play state, from `playerctl -a --follow`: Playing beats
# Paused beats Stopped, then the latest to change. Clicks act on the player the bar shows.
[modules.player-play-pause]
source = "player"
display = "icon"
glyph = "" # fa-stop: no player

[modules.player-play-pause.clicks]
left = ["player", "play-pause", "{target}"]

# The chosen player's "Artist – Title", cut to 40 characters when drawn.
[modules.player-metadata]
source = "player"
display = "text"

# The player capsule (record 0003 §1-2): one "now playing" module, the play-state icon, then
# "Artist – Title" in a fixed width, scrolling while it plays, and the track's progress as an
# underline. Right-click opens `barmenu player`. Not on by default: the dotfiles turn it on
# (with a [module/player-capsule] whose hook-0 = barctl render player-capsule).
#
# [modules.player-capsule]
# source = "player"
# display = "capsule"
# glyph = "\U000F038A"   # md-music_note_off: before the source has written it
# glyph_override = { active = "\U000F040A", idle = "\U000F03E4", unavailable = "\U000F038A" }
# width = 32             # cells of text after the icon (8-80)
# scroll = 2.0           # steps per second (0-4); 0 cuts with "…" instead
# scroll_rest = 10       # seconds the start of the title rests between passes (0-120)
# accent = "role"        # or "art": the cover's colour on the line and icon (curl, magick)
#
# [modules.player-capsule.clicks]
# left = ["playerctl", "-p", "{target}", "play-pause"]
# middle = ["playerctl", "-p", "{target}", "next"]
# scroll-up = ["playerctl", "-p", "{target}", "volume", "0.05+"]
# scroll-down = ["playerctl", "-p", "{target}", "volume", "0.05-"]
# right = ["barmenu", "player"]

# The coordinator strip: one cell per coordinator, pushed by crew (brain record 0019 §7, dotfiles
# record 0003 Part C) with each cell's tier (unavailable stopped, idle running, active busy,
# alert waiting for input) and the shown one underlined. A left click shows or hides it, starting
# a stopped one; a right click opens that coordinator's quick menu; a middle click anywhere on the
# strip opens the full menu; scrolling cycles through the running ones (record 0019 §7a).
[modules.crew]
pusher = "crew"
display = "icon"
separator = ""

[modules.crew.segment_clicks]
left = ["crew", "toggle", "--launch", "{segment}"]
middle = ["crew", "menu"]
right = ["crew", "quick", "{segment}"]
scroll-up = ["crew", "cycle", "prev"]
scroll-down = ["crew", "cycle", "next"]
