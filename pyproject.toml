[project]
name = "desktop-tools"
# Owned by release-please: never edit by hand (see the wiki's Release-Process page).
version = "0.1.13"
description = "Stephen\u0027s desktop tools in Python: barctl (the Polybar controller), barmenu and the rest of the dotfiles\u0027 tools"
readme = "README.md"
requires-python = ">=3.13"
license = "Unlicense"
dependencies = [
    "interpose @ git+https://github.com/metalayerlab/interpose@v0.2.0",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
desktop-tools = "desktop_tools.cli:main"
barctl = "desktop_tools.barctl.cli:main"
barmenu = "desktop_tools.barmenu.cli:main"
crew = "desktop_tools.crew.cli:main"
devices = "desktop_tools.devices.cli:main"

[project.urls]
Homepage = "https://github.com/andronics/desktop-tools"
Documentation = "https://github.com/andronics/desktop-tools/wiki"
Changelog = "https://github.com/andronics/desktop-tools/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_tools"]

[tool.hatch.metadata]
# interpose is pinned by its git URL, not PyPI (template-python decision 0003)
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; scripts print, and run git, by design.
"tests/*" = ["S101"]
"scripts/*" = ["T20", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src/desktop_tools", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --cov --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
markers = ["integration: talks to real external systems; deselect with -m 'not integration'"]
# A deprecation fails the dependency bump that brings it, not a later run.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["desktop_tools"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
