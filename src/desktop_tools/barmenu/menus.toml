# barmenu's menus: the default the package ships, from the zsh barmenu's table.
#
# $XDG_CONFIG_HOME/barmenu/menus.toml (or the file $BARMENU_CONFIG names) adds menus and replaces
# whole menus of the same name. Each menu: its bar button's glyph, a title, the side of the
# screen it falls back to when the pointer can't be read, a settle time (seconds to wait after
# rofi closes before the command runs, so a screenshot never catches rofi fading out), and its
# rows. A row's command is a shell command (run with `zsh -fc`, as before) or a list of
# arguments; `current = true` marks it (rofi's active rows, in the theme's accent).
# `dynamic = "<module>"` appends the rows barctl's source for that module gives;
# `provider = "<name>"` takes the rows a Python function in barmenu/providers/ gives when the
# menu opens, any static rows following them. A menu has one of the two, never both.
# Glyphs are current Nerd Font codepoints (the zsh table's legacy U+F900-U+FAFF ones mapped to
# their nf-md names), written as escapes.

[menus.layout]
glyph = "\U000F05B2" # md-window_restore
title = "Layout"
side = "left"
rows = [
    { label = "DEFAULT", command = "bsp-layout set tiled" },
    { label = "EVEN", command = "bsp-layout set even" },
    { label = "GRID HORIZONTAL", command = "bsp-layout set grid" },
    { label = "GRID VERTICAL", command = "bsp-layout set rgrid" },
    { label = "TALL LEFT", command = "bsp-layout set tall" },
    { label = "TALL RIGHT", command = "bsp-layout set rtall" },
    { label = "WIDE TOP", command = "bsp-layout set wide" },
    { label = "WIDE BOTTOM", command = "bsp-layout set rwide" },
]

[menus.screenshot]
glyph = "\U000F0100" # md-camera
title = "Screenshot"
side = "left"
settle = 0.5
rows = [
    { glyph = "", label = "FULLSCREEN", command = "screenshot fullscreen" },
    { glyph = "", label = "GEOMETRY", command = "screenshot geometry" },
    { glyph = "", label = "SELECTION", command = "screenshot selection" },
    { glyph = "", label = "WINDOW", command = "screenshot window" },
    { glyph = "", label = "DELAYED…", command = "screenshot delayed" },
]

[menus.settings]
glyph = "" # fa-gear
title = "Settings"
side = "left"
rows = [
    { label = "BSPWM", command = "code ~/.config/bspwm" },
    { label = "POLYBAR", command = "code ~/.config/polybar" },
    { label = "DOTFILES", command = "code ~/.dotfiles" },
    { label = "SXHKD", command = "code ~/.config/sxhkd/sxhkdrc" },
]

[menus.vpn]
glyph = "\U000F0582" # md-vpn
title = "VPN"
side = "left"
rows = [
    { glyph = "\U000F0484", label = "CONNECT", command = "nordvpn connect" },                # md-security_network
    { glyph = "\U000F015B", label = "Disconnect", command = "nordvpn disconnect" },          # md-close_network
    { glyph = "\U000F02FD", label = "Information", command = 'dunstify -t 0 "VPN Status" "$(nordvpn status)"' }, # md-information_outline
]

[menus.session]
glyph = "" # fa-user
title = "Session"
side = "right"
rows = [
    { glyph = "\U000F05FD", label = "QUIT", command = "power logout" }, # md-logout_variant
    { glyph = "\U000F0453", label = "COMPOSITOR", command = "killall -eq picom; sleep 1.5; picom --config ~/.config/picom/picom.conf -b" }, # md-reload
]

# Record 0001 §2: rows from barmenu/providers/theme.py (the applied scheme's title, the mode not
# in use).
[menus.theme]
glyph = "\U000F03D8" # md-palette
title = "Theme"
side = "left"
provider = "theme"

# Record 0001 §3: rows from barmenu/providers/lock.py (the idle lock's state marked).
[menus.lock]
glyph = "\uF023" # fa-lock
title = "Lock"
side = "right"
provider = "lock"

# Record 0002 §1-2: rows from barmenu/providers/tessera.py (the key's lock state marked, the
# password store's sync state). Opened by the bar module's right-click.
[menus.tessera]
glyph = "\U000F033E" # md-lock
title = "Passwords"
side = "right"
provider = "tessera"

# Record 0003 §4: rows from barmenu/providers/player.py (next, previous, loop and shuffle marked,
# the player choice, seeking), on the player barctl's player-capsule shows. Opened by its
# right-click.
[menus.player]
glyph = "\U000F0387" # md-music_note
title = "Player"
side = "right"
provider = "player"

# Record 0003 §4: rows from barmenu/providers/players.py (every player, the shown one marked,
# then Automatic); a pick pins it with `barctl pin player-capsule`.
[menus.players]
glyph = "\U000F0387" # md-music_note
title = "Players"
side = "right"
provider = "players"

# Record 0003 §10: rows from barmenu/providers/outputs.py (every sink, the default marked; connect
# or disconnect each paired Bluetooth audio device; the mixer). Opened by the output segment's
# right-click and the player menu's `Output ›` row.
[menus.outputs]
glyph = "\U000F04C3" # md-speaker
title = "Output"
side = "right"
provider = "outputs"

# Record 0004 §3: rows from barmenu/providers/printer.py (the queue, pause or resume by state, the
# default with two or more queues, a test page, the printer's state, its settings). Opened by
# the printer module's right-click. Every action row runs `devices printer`.
[menus.printer]
glyph = "\U000F042A" # md-printer
title = "Printer"
side = "left"
provider = "printer"

# Record 0004 §3: rows from barmenu/providers/printer_queue.py (one per unfinished job, newest
# first: number, state and age, never the name; picking one cancels it after a Yes/No).
[menus.printer-queue]
glyph = "\U000F0279" # md-format_list_bulleted
title = "Print queue"
side = "left"
provider = "printer_queue"

# Record 0004 §3: one row per queue, the default marked (`devices printer default <queue>`).
[menus.printer-default]
glyph = "\U000F04CE" # md-star
title = "Default printer"
side = "left"
provider = "printer_default"

# Record 0004 §3: rows from barmenu/providers/scanner.py (scan from the feeder, both sides, the
# flatbed; the preset, the folder, Simple Scan; the last scan). Opened by the scanner module's
# right-click. Every scan row runs `devices scan`.
[menus.scanner]
glyph = "\U000F06AB" # md-scanner
title = "Scanner"
side = "left"
provider = "scanner"

[menus.scanner-presets]
glyph = "\U000F062E" # md-tune
title = "Scan preset"
side = "left"
provider = "scanner_presets"

[menus.scanner-folders]
glyph = "\U000F0770" # md-folder_open
title = "Save scans to"
side = "left"
provider = "scanner_folders"

[menus.scanner-devices]
glyph = "\U000F06AB" # md-scanner
title = "Scanners"
side = "left"
provider = "scanner_devices"
