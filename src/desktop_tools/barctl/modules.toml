# barctl's modules: the default the package ships (dotfiles record 0003 §B4).
#
# The dotfiles' desktop/.config/barctl/modules.toml, linked to $XDG_CONFIG_HOME/barctl/modules.toml,
# replaces this file whole. Each module here is a polybar `custom/ipc` module whose
# `hook-0 = barctl render <module>`. Clicks run detached, through `barctl click <module> <button>`;
# {target} is the module's current target (the shown player, the default sink), filled in as a
# whole argument. Glyphs are current Nerd Font codepoints, written as escapes.

# The default sink's volume, from `pactl subscribe`.
[modules.audio-level]
source = "volume"
display = "both"
glyph = "\U000F0581" # md-volume_off: no pulse server yet

[modules.audio-level.clicks]
left = ["audio", "mute-toggle"]
right = ["pwvucontrol"]
scroll-up = ["audio", "volume-increase"]
scroll-down = ["audio", "volume-decrease"]

# The chosen MPRIS player's icon and play state, from `playerctl -a --follow`: Playing beats
# Paused beats Stopped, then the latest to change. Clicks act on the player the bar shows.
[modules.player-play-pause]
source = "player"
display = "icon"
glyph = "" # fa-stop: no player

[modules.player-play-pause.clicks]
left = ["player", "play-pause", "{target}"]

# The chosen player's "Artist – Title", cut to 40 characters when drawn.
[modules.player-metadata]
source = "player"
display = "text"

# The player capsule (record 0003 §1-2): one "now playing" module, the play-state icon, then
# "Artist – Title" in a fixed width, scrolling while it plays, and the track's progress as an
# underline. Right-click opens `barmenu player`. Not on by default: the dotfiles turn it on
# (with a [module/player-capsule] whose hook-0 = barctl render player-capsule).
#
# [modules.player-capsule]
# source = "player"
# display = "capsule"
# glyph = "\U000F038A"   # md-music_note_off: before the source has written it
# glyph_override = { active = "\U000F040A", idle = "\U000F03E4", unavailable = "\U000F038A" }
# width = 32             # cells of text after the icon (8-80)
# scroll = 2.0           # steps per second (0-4); 0 cuts with "…" instead
# scroll_rest = 10       # seconds the start of the title rests between passes (0-120)
# accent = "role"        # or "art": the cover's colour on the line and icon (curl, magick)
# fade_after = 0         # minutes paused or stopped before it shows its icon alone (0-240;
#                        # 0 never). glyph_override.unavailable = "" hides it with no player
# spoken = false         # podcasts and audiobooks (record 0005 phase B): ±30 s and a speed
#                        # row in barmenu player, the line at the player's rate
# spoken_players = []    # player names always taken as spoken word, e.g. ["gpodder", "cozy"]
# expand_for = 0         # seconds the transport row stays open (record 0005 phase C; 0-30, 0
#                        # never): previous, play-pause, next, loop, shuffle and a seek bar in
#                        # the title's place, opened by a left-click on the icon
#
# [modules.player-capsule.icon_clicks]       # the icon alone: opens and folds the row
# left = ["barctl", "expand", "player-capsule"]
#
# [modules.player-capsule.segment_clicks]    # the row's cells
# left = ["barctl", "transport", "player-capsule", "{segment}"]
#
# [modules.player-capsule.clicks]
# left = ["playerctl", "-p", "{target}", "play-pause"]
# middle = ["playerctl", "-p", "{target}", "next"]
# scroll-up = ["playerctl", "-p", "{target}", "volume", "0.05+"]
# scroll-down = ["playerctl", "-p", "{target}", "volume", "0.05-"]
# right = ["barmenu", "player"]

# The player chips (record 0005 phase A), just before the capsule: one chip per MPRIS player, in
# the order each was first seen, its app icon (instances.json; else `glyph`) in the active colour
# while it plays and idle otherwise; the shown player's chip underlined, the pinned one's with
# md-pin. Drawn only with chips_min players or more; past chips_max the last cell is "+N" (id
# `more`). Left pins that player (again: unpins), middle plays or pauses it, right opens
# `barmenu players`. Not on by default: the dotfiles turn it on (with a [module/player-chips]
# whose hook-0 = barctl render player-chips; the cells carry their own action tags).
#
# [modules.player-chips]
# source = "player"
# display = "chips"
# glyph = "\U000F075A"   # md-music: a player with no icon of its own
# separator = " "
# chips_min = 2          # fewer players than this: nothing is drawn (1-8)
# chips_max = 4          # more: the last cell is "+N", which opens barmenu players (1-8)
#
# [modules.player-chips.segment_clicks]
# left = ["barctl", "pin", "player-capsule", "{segment}", "--toggle"]
# middle = ["playerctl", "-p", "{segment}", "play-pause"]
# right = ["barmenu", "players"]
#
# [modules.player-chips.segment_clicks.more]   # the "+N" cell's own clicks
# left = ["barmenu", "players"]

# The output segment (record 0003 §10), beside the player capsule on the same background: the
# default sink's kind glyph and short name (the dotfiles' audio/devices.json names, else the
# sink's own), a Bluetooth sink's battery, the volume glyph and percentage; muted, md-volume_off
# in the idle colour. A Bluetooth sink appearing shows "<name> connected" for 5 seconds, and
# "<name> disconnected" when it goes. barctl never switches the sink itself. Not on by default:
# the dotfiles turn it on (with a [module/output-capsule] whose hook-0 = barctl render
# output-capsule).
#
# [modules.output-capsule]
# source = "volume"
# display = "output"
# glyph = "\U000F0581"   # md-volume_off: before the source has written it
#
# [modules.output-capsule.clicks]
# left = ["audio", "mute-toggle"]
# scroll-up = ["audio", "volume-increase"]
# scroll-down = ["audio", "volume-decrease"]
# right = ["barmenu", "outputs"]

# The printer (record 0004 §1): the default CUPS queue from IPP events, its reachability from
# DNS-SD; the glyph by reason (paper, ink, the rest), the count the unfinished jobs. Not on by
# default: the dotfiles turn it on (with a [module/printer] whose hook-0 = barctl render printer)
# and choose the idle, active and unavailable glyphs (glyph_override), leaving alert to the
# source's reason glyphs (open question 6).
#
# [modules.printer]
# source = "printer"
# display = "icon"
# glyph = "\U000F042A"   # md-printer: before the source has written it
# glyph_override = { idle = "\U000F042A", active = "\U000F042A", unavailable = "\U000F0E5D" }
#
# [modules.printer.clicks]
# left = ["barmenu", "printer-queue"]
# middle = ["system-config-printer"]
# right = ["barmenu", "printer"]

# The scanner (record 0004 §1): the configured scanner's presence from DNS-SD, its eSCL status
# and our own scans' progress (the count is the pages so far). Left-click scans with the
# remembered preset, from the feeder when it is loaded, else the flatbed (open question 5). Not
# on by default, as the printer.
#
# [modules.scanner]
# source = "scanner"
# display = "icon"
# glyph = "\U000F06AB"   # md-scanner: before the source has written it
#
# [modules.scanner.clicks]
# left = ["devices", "scan"]
# middle = ["simple-scan"]
# right = ["barmenu", "scanner"]

# The coordinator strip: one cell per coordinator, pushed by crew (brain record 0019 §7, dotfiles
# record 0003 Part C) with each cell's tier (unavailable stopped, idle running, active busy,
# alert waiting for input) and the shown one underlined. A left click shows or hides it, starting
# a stopped one; a right click opens that coordinator's quick menu; a middle click anywhere on the
# strip opens the full menu; scrolling cycles through the running ones (record 0019 §7a).
[modules.crew]
pusher = "crew"
display = "icon"
separator = ""

[modules.crew.segment_clicks]
left = ["crew", "toggle", "--launch", "{segment}"]
middle = ["crew", "menu"]
right = ["crew", "quick", "{segment}"]
scroll-up = ["crew", "cycle", "prev"]
scroll-down = ["crew", "cycle", "next"]
