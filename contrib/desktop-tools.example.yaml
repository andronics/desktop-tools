# desktop-tools configuration: every setting, with its default.
#
# Copy to /etc/desktop-tools/config.yaml (or point DESKTOP_TOOLS_CONFIG / --config
# at it). Every key can also be set as an environment variable,
# DESKTOP_TOOLS_<KEY> (dots become underscores), or read from a file with
# DESKTOP_TOOLS_<KEY>_FILE. Secrets belong in _FILE, never in this file.
# Full reference: the wiki's In-Depth-Configuration page.

# DEBUG, INFO, WARNING or ERROR
log_level: INFO
